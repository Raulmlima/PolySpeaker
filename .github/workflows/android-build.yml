name: Android Build (App Bundle)

# Manual only — does not run on push, so it never interferes with the iOS
# workflow or gets triggered by unrelated commits. Click "Run workflow" in
# the Actions tab whenever you want a new .aab to upload to Play Console.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json

      - name: Expo prebuild Android
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_DOTENV: 1

      - name: Set unique version code
        # versionCode must increase on every Play Console upload — derive it
        # from the workflow run number (offset keeps it well above any manual uploads)
        run: |
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          sed -i "s/versionCode [0-9]\+/versionCode $VERSION_CODE/" android/app/build.gradle
          echo "Version code set to $VERSION_CODE"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/polyspeaker-release.keystore

      - name: Override signing config for CI
        # withReleaseSigning.js (plugins/) writes an absolute Windows dev-machine
        # path (C:\p\polyspeaker2-keys\...) into android/gradle.properties during
        # prebuild — that's for local builds only and breaks on Linux, plus
        # plain `env:` vars on the gradle step below are NOT Gradle project
        # properties (only ORG_GRADLE_PROJECT_*-prefixed ones are), so they can't
        # override it either. gradle.properties takes precedence over env-derived
        # properties, so the only reliable fix is to overwrite the same keys
        # in the file itself — a later duplicate key wins when Java loads a
        # .properties file.
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          {
            echo "POLYSPEAKER_RELEASE_STORE_FILE=polyspeaker-release.keystore"
            echo "POLYSPEAKER_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "POLYSPEAKER_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "POLYSPEAKER_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> android/gradle.properties

      - name: Build signed App Bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: polyspeaker-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
