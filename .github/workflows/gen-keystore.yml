name: (Temp) Generate Android Keystore
on: workflow_dispatch
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore polyspeaker-release.jks \
            -alias polyspeaker \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "PolySpk2026!Release" \
            -keypass "PolySpk2026!Release" \
            -dname "CN=PolySpeaker, OU=UFABC, O=PolySpeaker, L=Santo Andre, ST=SP, C=BR"
      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: polyspeaker-release-keystore
          path: polyspeaker-release.jks
          retention-days: 1
